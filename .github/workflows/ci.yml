name: TechPulse checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: techpulse
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: techpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techpulse -d techpulse_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://techpulse:testpassword@localhost:5432/techpulse_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
